[build-system]
requires = ["setuptools >= 60", "wheel >= 0.35"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "cjkcms.__version__" }
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {dev = { file = ["requirements-dev.txt"] }}

[tool.setuptools]
packages = ["cjkcms"]

[tool.distutils.bdist_wheel]
universal = true

[tool.ruff]
line-length = 100


[project.scripts]
cjkcms = "cjkcms.bin.cjkcms:main"

[project]
name = "wagtail-cjkcms"
dynamic = ["version", "dependencies"]
description = "Wagtail Content Management System, installable as a Django app into any Wagtail 7.x site."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Grzegorz Krol", email = "gk@cjk.pl" }]
keywords = ["wagtail", "django", "cms"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.urls]
"Homepage" = "https://cjkcms.com"
"Repository" = "https://github.com/cjkpl/wagtail-cjkcms"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cjkcms.tests.settings"
# Doctest collection pulls in Django/Wagtail before optional deps are available.
addopts = "--durations=0"
